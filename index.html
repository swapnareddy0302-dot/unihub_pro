
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061020">
  <title>UniHub | Easy campus</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand brand-auth">
        <div class="logo-mark"><span>U</span><i></i><b></b></div>
        <div class="logo-copy">
          <strong>UniHub</strong>
          <small>CAMPUS CONNECT</small>
        </div>
      </div>
      <p class="eyebrow">YOUR CAMPUS, CONNECTED</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to access your campus workspace.</p>
      <form id="authForm">
        <label class="field">
          <span>Full name</span>
          <input id="authName" required maxlength="100" placeholder="Enter your name">
        </label>
        <label class="field">
          <span>Student / Staff ID</span>
          <input id="authIdentifier" required maxlength="40" placeholder="Enter your ID">
        </label>
        <p id="authMessage" class="auth-message hidden"></p>
        <button class="primary-btn full-btn" type="submit">Enter UniHub <span>→</span></button>
      </form>
      <p class="fine-print">Frontend demo · Data saved in this browser</p>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-mark"><span>U</span><i></i><b></b></div>
        <div class="logo-copy">
          <strong>UniHub</strong>
          <small>CAMPUS CONNECT</small>
        </div>
        <button id="sidebarClose" class="icon-btn sidebar-close" type="button" aria-label="Close menu">×</button>
      </div>

      <div class="workspace-caption">WORKSPACE</div>
      <div class="role-caption">Viewing portal as</div>
      <label class="role-select-wrap">
        <select id="roleSelect" aria-label="Choose demo role">
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
          <option value="office">Office</option>
        </select>
      </label>

      <nav id="navList" class="nav-list" aria-label="Main navigation"></nav>

      <div class="sidebar-bottom">
        <div class="signed-in">
          <div id="profileAvatar" class="avatar">U</div>
          <div class="signed-in-copy">
            <strong id="sidebarUserName">User</strong>
            <small id="sidebarUserIdentifier">ID</small>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">↪ <span>Logout</span></button>
      </div>
    </aside>

    <div id="sidebarScrim" class="sidebar-scrim"></div>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuToggle" class="icon-btn menu-toggle" type="button" aria-label="Open menu">☰</button>
          <div class="top-brand">
            <div class="logo-mark mini-logo"><span>U</span><i></i><b></b></div>
            <strong>UniHub</strong>
            <span class="top-divider">/</span>
            <span id="pageCrumb">Dashboard</span>
          </div>
        </div>
        <div class="topbar-right">
          <span id="currentDate" class="date-line"></span>
          <button id="previousBtn" class="icon-btn previous-btn" type="button" aria-label="Previous page">←</button>
          <div class="user-chip">
            <div id="topAvatar" class="avatar top-avatar">U</div>
            <div class="user-chip-copy">
              <strong id="profileName">User</strong>
              <small id="profileIdentifier">ID</small>
            </div>
          </div>
          <button id="topLogoutBtn" class="top-logout" type="button">Logout</button>
        </div>
      </header>

      <div id="pageContent" class="content"></div>

      <footer class="footer">
        <span>© <span id="currentYear"></span> UniHub · Campus Connect</span>
        <span>Frontend jury demo</span>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
